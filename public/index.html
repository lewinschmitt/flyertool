<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f5d0a">
<title>Flyer verteilen · Kreise 6 und 10</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet-geoman.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Flyer verteilen <span>Kreise 6 und 10</span></h1>
    <button id="who" class="chip" type="button" title="Namen ändern"></button>
    <button id="adminBtn" class="chip chip-admin" type="button" hidden>Verwalten</button>
  </div>
  <div class="top-row">
    <label class="campaign">
      <span>Kampagne</span>
      <select id="campaign" aria-label="Kampagne wählen"></select>
    </label>
    <div class="progress" id="progress" aria-live="polite"></div>
  </div>
</header>

<main>
  <div id="map" aria-label="Karte der Verteilgebiete"></div>
  <section id="list" class="list" hidden></section>

  <div class="legend" id="legend">
    <span><i class="dot free"></i>frei</span>
    <span><i class="dot claimed"></i>vergeben</span>
    <span><i class="dot done"></i>verteilt</span>
  </div>
  <button id="onlyFree" class="filter" type="button" aria-pressed="false"></button>
  <button id="locate" class="fab" type="button" aria-label="Meinen Standort zeigen" title="Mein Standort">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>
  <div id="drawbar" class="drawbar" hidden>
    <span>Eckpunkte der Fläche antippen</span>
    <button type="button" id="drawDone" class="btn small primary">Fertig</button>
    <button type="button" id="drawCancel" class="btn small">Abbrechen</button>
  </div>
</main>

<nav class="tabs" aria-label="Ansicht">
  <button type="button" data-view="map" class="on">Karte</button>
  <button type="button" data-view="list">Liste</button>
  <button type="button" data-view="mine">Meine Gebiete</button>
</nav>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="false"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-geoman.js"></script>
<script src="app.js"></script>
</body>
</html>
